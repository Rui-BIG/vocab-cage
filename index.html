<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<title>Vocab Cage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column; sticky tab bar; each word is a "specimen card" whose headword is dissected into colour-coded morphemes. */
:root {
  --paper: #F3F5F1;
  --surface: #FFFFFF;
  --sunk: #ECEFE9;
  --ink: #17202A;
  --muted: #59626D;
  --line: #D8DCD3;
  --accent: #12584F;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEDE8;
  --pre: #1F62A3;   --pre-bg: #E4EDF7;
  --root: #A33C25;  --root-bg: #F6E7E2;
  --suf: #7A5F00;   --suf-bg: #F3ECD6;
  --danger: #A3262A;
  --warn: #8C5600;  --warn-bg: #F7EBD5;
  --shadow: 0 1px 2px rgba(23,32,42,.06), 0 6px 20px rgba(23,32,42,.06);
  --f-word: "Charis SIL", "Charis", "Gentium Plus", "Georgia", serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151B; --surface: #192029; --sunk: #141A21; --ink: #E5E8EB; --muted: #9AA3AE; --line: #2B3440;
    --accent: #5EC4AF; --accent-ink: #0A1E1A; --accent-soft: #173830;
    --pre: #82B4EA; --pre-bg: #1A2A3C; --root: #F0907A; --root-bg: #3A231E; --suf: #DDBF5C; --suf-bg: #342D16;
    --danger: #F2868A; --warn: #E6AE55; --warn-bg: #352A15;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151B; --surface: #192029; --sunk: #141A21; --ink: #E5E8EB; --muted: #9AA3AE; --line: #2B3440;
  --accent: #5EC4AF; --accent-ink: #0A1E1A; --accent-soft: #173830;
  --pre: #82B4EA; --pre-bg: #1A2A3C; --root: #F0907A; --root-bg: #3A231E; --suf: #DDBF5C; --suf-bg: #342D16;
  --danger: #F2868A; --warn: #E6AE55; --warn-bg: #352A15;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
html, body { background: var(--paper); color: var(--ink); }
body { font: 16px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 8px 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-word); font-weight: 700; font-size: 1.25rem; letter-spacing: .01em; display: flex; align-items: baseline; gap: 2px; flex: none; }
.brand .b1 { color: var(--pre); } .brand .b2 { color: var(--root); }
.sync { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); flex-basis: 100%; order: 5; min-width: 0; line-height: 1.3; }
body.chem .sync { display: none; }
.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 3px; border-radius: 999px; order: 4; }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: .92rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.sync.local { color: var(--warn); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.iconbtn[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
.iconbtn svg { width: 20px; height: 20px; }

/* bottom dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dock-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.dtab { border: 0; background: transparent; padding: 8px 2px 7px; display: grid; justify-items: center; gap: 2px; font-size: .72rem; font-weight: 700; color: var(--muted); cursor: pointer; position: relative; }
.dtab svg { width: 22px; height: 22px; }
.dtab[aria-selected="true"] { color: var(--accent); }
.dtab[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; }
.badge { position: absolute; top: 4px; left: calc(50% + 7px); background: var(--accent); color: var(--accent-ink); font-family: var(--f-mono); font-size: .62rem; line-height: 16px; border-radius: 999px; padding: 0 5px; min-width: 16px; text-align: center; font-variant-numeric: tabular-nums; }
.badge.quiet { background: var(--sunk); color: var(--muted); }

main { padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 18px; }

/* search */
.searchbox { display: flex; gap: 8px; }
.searchbox input { flex: 1; min-width: 0; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); font-family: var(--f-word); font-size: 1.15rem; }
.searchbox input:focus { border-color: var(--accent); outline: none; }
.btn { border: 1.5px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: var(--r); cursor: pointer; font-weight: 700; font-size: .92rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
.searchbox .btn { padding-inline: 18px; }
.hint { color: var(--muted); font-size: .9rem; }
.try { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chipbtn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 11px; cursor: pointer; font-family: var(--f-word); font-size: .95rem; }
.chipbtn:hover { border-color: var(--accent); color: var(--accent); }

.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.notice.warn { background: var(--warn-bg); border-color: transparent; }
.notice .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* specimen card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.card-head { padding: 18px 18px 14px; display: grid; gap: 6px; border-bottom: 1px dashed var(--line); }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.plain { background: var(--sunk); color: var(--muted); }
.tag.draft { background: var(--warn-bg); color: var(--warn); }
.headword { font-family: var(--f-word); font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.1; font-weight: 700; margin: 2px 0 0; overflow-wrap: anywhere; }
.headword .hseg-prefix { color: var(--pre); } .headword .hseg-root, .headword .hseg-combining { color: var(--root); } .headword .hseg-suffix { color: var(--suf); }
.headword .hseg + .hseg { margin-left: 1px; border-left: 1.5px dotted var(--line); padding-left: 1px; }
.pron { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); }
.ipa { font-family: var(--f-word); font-size: 1.1rem; color: var(--ink); }
.pos { font-style: italic; }
.speak { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--accent); }
.speak svg { width: 16px; height: 16px; }
.corrected { font-size: .88rem; color: var(--warn); }

.sec { padding: 14px 18px; display: grid; gap: 10px; }
.sec + .sec { border-top: 1px solid var(--line); }
.sec h3 { margin: 0; }

.strip { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.morph { border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; flex: 1 1 140px; max-width: 100%; }
.morph.prefix { background: var(--pre-bg); } .morph.root, .morph.combining { background: var(--root-bg); } .morph.suffix { background: var(--suf-bg); }
.morph .mt { font-family: var(--f-word); font-weight: 700; font-size: 1.25rem; }
.morph.prefix .mt { color: var(--pre); } .morph.root .mt, .morph.combining .mt { color: var(--root); } .morph.suffix .mt { color: var(--suf); }
.morph .mk { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.morph .mm { font-weight: 700; font-size: .95rem; }
.morph .mo { font-size: .82rem; color: var(--muted); font-style: italic; }
.plus { align-self: center; color: var(--muted); font-family: var(--f-mono); }
.literal { font-family: var(--f-word); font-size: 1.05rem; padding-left: 12px; border-left: 3px solid var(--accent); }

.def { font-size: 1.05rem; margin: 0; max-width: 65ch; }
.sub { margin: 0; max-width: 65ch; }
.sub b { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-right: 6px; }
.ex { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.ex li { font-family: var(--f-word); font-style: italic; padding-left: 14px; position: relative; max-width: 65ch; }
.ex li::before { content: "›"; position: absolute; left: 0; color: var(--muted); font-style: normal; }
.ex li b { font-style: normal; color: var(--accent); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
.kv dt { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.kv dd { margin: 0; min-width: 0; }
.formlist { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.formlist span i { color: var(--muted); font-size: .88rem; }
.rel { display: grid; gap: 8px; }
.relrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.relpart { font-family: var(--f-word); font-weight: 700; margin-right: 4px; }
.relpart small { font-family: var(--f-body); font-weight: 400; color: var(--muted); }
.notes { white-space: pre-wrap; margin: 0; }

.card-foot { padding: 12px 18px; background: var(--sunk); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); }
.card-foot label { font-size: .85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.card-foot select, .card-foot input { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 170px; }
.card-foot .grow { flex: 1; }
.saved-pill { font-weight: 700; color: var(--accent); display: inline-flex; gap: 6px; align-items: center; }

/* loading */
.loading { display: grid; gap: 12px; padding: 20px 18px; }
.ghostrow { display: flex; gap: 6px; }
.ghostrow span { height: 54px; border-radius: 8px; flex: 1; background: var(--sunk); animation: pulse 1.4s ease-in-out infinite; }
.ghostrow span:nth-child(1) { background: var(--pre-bg); } .ghostrow span:nth-child(2) { background: var(--root-bg); animation-delay: .2s; } .ghostrow span:nth-child(3) { background: var(--suf-bg); animation-delay: .4s; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .ghostrow span { animation: none; } }

/* cage */
.toolbar { display: grid; gap: 8px; }
.toolbar input[type=search] { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters select { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .9rem; min-width: 0; max-width: 100%; }
.summary { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.list { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { display: grid; gap: 3px; padding: 12px 16px; border: 0; background: transparent; text-align: left; cursor: pointer; width: 100%; }
.item + .item { border-top: 1px solid var(--line); }
.item:hover { background: var(--sunk); }
.item .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item .w { font-family: var(--f-word); font-weight: 700; font-size: 1.2rem; }
.item .parts { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.item .d { color: var(--muted); font-size: .92rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { text-align: center; padding: 36px 18px; display: grid; gap: 12px; justify-items: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
.empty h2 { font-family: var(--f-word); margin: 0; font-size: 1.4rem; }
.empty p { margin: 0; color: var(--muted); max-width: 44ch; }

details.decks { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.decks summary { padding: 10px 14px; cursor: pointer; font-weight: 700; font-size: .92rem; }
.deckbody { padding: 0 14px 14px; display: grid; gap: 8px; }
.deckrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.deckrow input { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.deckrow .count { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }

.back { justify-self: start; }

/* edit form */
form.edit { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.field { display: grid; gap: 4px; }
.field > span { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); width: 100%; min-width: 0; }
.field textarea { min-height: 72px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.partrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px; border-radius: 8px; background: var(--sunk); }
.partrow input, .partrow select { padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; width: 100%; }
.partrow .rm { grid-column: 1 / -1; justify-self: end; }
.formfoot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* review */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.stat .v { font-family: var(--f-word); font-size: 1.9rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .k { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.stat.hot .v { color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.panel h2 { font-family: var(--f-word); margin: 0; font-size: 1.4rem; text-wrap: balance; }
.panel p { margin: 0; }
.optrow { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.optrow label { display: flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
.optrow select { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 180px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.progress { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; flex: 1 1 120px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.sessionbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sessionbar .count { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.flash { min-height: 280px; cursor: pointer; display: grid; place-content: center; justify-items: center; text-align: center; padding: 28px 18px; gap: 12px; border: 0; width: 100%; background: var(--surface); }
.flash .prompt { font-family: var(--f-word); font-size: 1.2rem; max-width: 52ch; }
.flash .tap { color: var(--muted); font-size: .88rem; }
.flash .mask { letter-spacing: .1em; color: var(--accent); }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.rate button { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 4px; cursor: pointer; display: grid; gap: 2px; font-weight: 700; justify-items: center; }
.rate button small { font-family: var(--f-mono); font-weight: 500; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate .again { color: var(--danger); } .rate .hard { color: var(--warn); } .rate .good { color: var(--accent); } .rate .easy { color: var(--pre); }
.rate button:hover { border-color: currentColor; }
.tally { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--f-mono); font-size: .85rem; font-variant-numeric: tabular-nums; }
.tally .again { color: var(--danger); } .tally .hard { color: var(--warn); } .tally .good { color: var(--accent); } .tally .easy { color: var(--pre); }
.keys { color: var(--muted); font-size: .8rem; }
@media (hover: none) { .keys { display: none; } }

/* quiz */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 20px 18px; display: grid; gap: 14px; }
.qprompt { font-family: var(--f-word); font-size: 1.2rem; max-width: 60ch; }
.qprompt .big { font-size: clamp(1.8rem, 6vw, 2.4rem); font-weight: 700; display: block; line-height: 1.15; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; font-size: 1rem; }
.opt .k { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); padding-top: 3px; flex: none; }
.opt.word { font-family: var(--f-word); font-size: 1.1rem; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--accent); background: var(--accent-soft); }
.opt.wrong { border-color: var(--danger); color: var(--danger); }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--accent); } .verdict.no { color: var(--danger); }
.typein { display: flex; gap: 8px; }

function partLabel(p) {
  if (p.type === "prefix" || p.type === "combining form") return p.text + "-";
  if (p.type === "suffix") return "-" + p.text;
  return p.text;
}
function partClass(t) { return t === "combining form" ? "combining" : t; }

function normalize(raw, query) {
  const parts = arr(raw.parts, 8).map((p) => ({
    text: str(p && p.text, 40).replace(/^-+|-+$/g, ""),
    type: PART_TYPES.includes(p && p.type) ? p.type : "root",
    meaning: str(p && p.meaning, 200),
    origin: str(p && p.origin, 200)
  })).filter((p) => p.text);
  return {
    word: str(raw.word, 80) || query,
    correctedFrom: str(raw.correctedFrom, 80),
    ipa: str(raw.ipa, 80),
    pos: str(raw.pos, 40),
    subject: SUBJECTS.includes(raw.subject) ? raw.subject : "General",
    field: str(raw.field, 60),
    parts,
    literal: str(raw.literal, 300),
    definition: str(raw.definition, 800),
    subjectMeaning: str(raw.subjectMeaning, 900),
    otherUses: str(raw.otherUses, 600),
    examples: arr(raw.examples, 3).map((e) => str(e, 400)).filter(Boolean),
    forms: arr(raw.forms, 8).map((f) => ({ form: str(f && f.form, 60), label: str(f && f.label, 60) })).filter((f) => f.form),
    synonyms: arr(raw.synonyms, 6).map((s) => str(s, 60)).filter(Boolean),
    related: arr(raw.related, 3).map((r) => ({
      part: str(r && r.part, 40), meaning: str(r && r.meaning, 120),
      words: arr(r && r.words, 6).map((w) => str(w, 40)).filter(Boolean)
    })).filter((r) => r.part && r.words.length),
    status: "complete"
  };
}

/* ---------- storage ---------- */
const LS_KEY = "vocabcage.v1";
const OFFLINE = !!window.VC_OFFLINE;
const store = { saveWord: null, deleteWord: null, saveMeta: null };
const chains = new Map();
function serial(key, fn) {
  const prev = chains.get(key) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  chains.set(key, next);
  return next;
}

function useLocal() {
  state.mode = "local";
  let saved = { words: {}, meta: { decks: [] } };
  try { const raw = localStorage.getItem(LS_KEY); if (raw) saved = JSON.parse(raw); } catch (e) {}
  state.words = new Map(Object.entries(saved.words || {}));
  state.meta = Object.assign({ decks: [] }, saved.meta || {});
  const persist = () => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ words: Object.fromEntries(state.words), meta: state.meta }));
    } catch (e) { toast("This browser isn’t keeping data. Words will be lost when you close the page."); }
  };
  store.saveWord = async (w) => { state.words.set(w.id, w); persist(); renderAll(); };
  store.deleteWord = async (id) => { state.words.delete(id); persist(); renderAll(); };
  store.saveMeta = async (m) => { state.meta = m; persist(); renderAll(); };
  store.saveMany = async (ws, onProgress) => { for (const w of ws) state.words.set(w.id, w); persist(); if (onProgress) onProgress(ws.length); renderAll(); return { saved: ws.length, failed: 0 }; };
  if (OFFLINE && navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
  state.ready = true;
  renderAll();
}

async function initStore() {
  let db = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      db = d;
      uid = u ? await u.id() : null;
    }
  } catch (e) { db = null; }
  if (!db || !uid) return useLocal();

  const base = db.doc("data/users/" + uid + "/vocab");
  const col = base.collection("words");
  state.mode = "remote";
  let gotWords = false, gotMeta = false;
  const settle = () => { if (gotWords && gotMeta && !state.ready) { state.ready = true; } renderAll(); };
  col.onSnapshot((snap) => {
    const m = new Map();
    for (const d of snap.docs) m.set(d.id, d.data());
    state.words = m; gotWords = true; settle();
  }, (err) => { toast("Lost the connection to your cage. Reload the page to reconnect."); console.warn(err); });
  base.onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : null;
    state.meta = Object.assign({ decks: [] }, d ? clone(d) : {});
    gotMeta = true; settle();
  }, (err) => { console.warn(err); gotMeta = true; settle(); });

  const fail = (e) => {
    const code = e && e.code;
    if (code === "quota_exceeded") toast("Your cage is full. Delete some words to make room.");
    else if (code === "invalid_argument") toast("This view can’t save changes. Open your own copy of the app.");
    else toast("Couldn’t save. Check your connection and try again.");
    throw e;
  };
  store.saveWord = (w) => serial("w:" + w.id, () => col.doc(w.id).set(w)).catch(fail);
  store.deleteWord = (id) => serial("w:" + id, () => col.doc(id).delete()).catch(fail);
  store.saveMeta = (m) => serial("meta", () => base.set(m)).catch(fail);
  store.saveMany = async (ws, onProgress) => {
    let saved = 0, failed = 0;
    for (const w of ws) {
      try { await serial("w:" + w.id, () => col.doc(w.id).set(w)); saved++; }
      catch (e) { failed++; if (e && e.code === "quota_exceeded") { toast("Your cage is full. Delete some words to make room."); break; } }
      if (onProgress) onProgress(saved + failed);
    }
    return { saved, failed };
  };
  renderAll();
}

/* ---------- AI lookup ---------- */
let samplePromise = null;
function getSample() {
  if (!samplePromise) {
    samplePromise = (window.claude && typeof window.claude.use === "function")
      ? window.claude.use("sample").catch(() => null)
      : Promise.resolve(null);
  }
  return samplePromise;
}

function buildPrompt(q) {
  return `You are a lexicographer and etymologist helping an advanced learner of English who studies medical, engineering and other subject vocabulary.

Analyse this English word or term: "${q}"

Reply with only one JSON object, no other text, in exactly this shape:
{
  "word": "the headword, correctly spelled, lowercase unless it is a proper noun",
  "correctedFrom": "the original input if you corrected a misspelling, otherwise an empty string",
  "ipa": "British English IPA between slashes",
  "pos": "part of speech, e.g. noun",
  "subject": "exactly one of: Medical, Engineering, Science, Computing, Law, Business, Humanities, General",
  "field": "the specific field, e.g. Cardiology or Structural engineering",
  "parts": [{"text": "the morpheme without hyphens", "type": "prefix | root | combining form | suffix", "meaning": "short meaning", "origin": "language and source word, e.g. Greek kardia 'heart'"}],
  "literal": "how the parts combine into the meaning, e.g. fast + heart + condition → 'condition of a fast heart'",
  "definition": "plain-English meaning in 1-2 sentences",
  "subjectMeaning": "what it means and how it is used in the field, 1-3 sentences",
  "otherUses": "other senses in other fields, or an empty string",
  "examples": ["two natural example sentences from the field"],
  "forms": [{"form": "another form of the word", "label": "e.g. plural, adjective, verb"}],
  "synonyms": ["up to 4 synonyms or near-synonyms"],
  "related": [{"part": "one morpheme from parts, written with a hyphen where it attaches, e.g. cardio- or -itis", "meaning": "its meaning", "words": ["3 to 5 other common words that contain it"]}]
}

Rules:
- Split the word into its genuine morphemes, in order, so that the parts spell the whole word when joined. Keep a connecting vowel inside the morpheme it belongs to (cardiology = "cardio" combining form + "logy" suffix).
- Never invent a prefix or suffix. A word with no meaningful breakdown has a single root part.
- Give one "related" entry for each meaningful morpheme, at most 3.
- Write in clear English for a learner.
- If the input is not an English word or term, reply {"error": "a short reason"}.`;
}

const ERR_COPY = {
  not_granted: "AI lookups are turned off for this page. Allow Claude in this page’s permissions to use them. You can still save the word as a draft.",
  sampling_disabled: "Claude isn’t available for this account, so lookups can’t run. You can still save the word as a draft.",
  rate_limited: "You’ve reached your Claude usage limit for now. Try again later, or save the word as a draft.",
  session_expired: "Your claude.ai sign-in has expired. Sign in again, then look the word up.",
  refused: "Claude couldn’t build a card for this word. Check the spelling and try again.",
  invalid_json: "The answer came back in the wrong format. Try the lookup again.",
  empty_completion: "The answer came back empty. Try the lookup again.",
  unavailable: "AI lookups aren’t available here. Open Vocab Cage on claude.ai while signed in. You can still save the word as a draft."
};

async function lookup(raw) {
  const q = raw.trim().replace(/\s+/g, " ");
  if (!q) return;
  if (!/^[A-Za-z][A-Za-z' \-]{0,59}$/.test(q)) {
    setSearch({ status: "error", query: q, entry: null, error: { code: "format", message: "Use English letters only, for example tachycardia or heat exchanger." } });
    return;
  }
  if (state.search.ctl) state.search.ctl.abort();
  $("q").value = q;
  showView("search");

  const saved = state.words.get(idFor(q));
  if (saved && state.search.forceAI !== q) {
    setSearch({ status: "done", query: q, entry: clone(saved), error: null, isExample: false, fromCage: true });
    return;
  }
  state.search.forceAI = null;

  const sample = await getSample();
  if (!sample) {
    // No AI here (offline phone app, or AI not available): quick draft from the built-in roots list.
    setSearch({ status: "done", query: q, entry: draftFromDictionary(q), error: null, isExample: false, fromCage: false, offline: true });
    return;
  }
  const ctl = new AbortController();
  setSearch({ status: "loading", query: q, entry: null, error: null, ctl });
  try {
    const res = await sample.json(buildPrompt(q.toLowerCase()), { signal: ctl.signal });
    if (ctl.signal.aborted) return;
    if (!res || typeof res !== "object" || Array.isArray(res)) throw { code: "invalid_json" };
    if (res.error) {
      setSearch({ status: "error", query: q, entry: null, error: { code: "notword", message: `“${q}” doesn’t look like an English word (${str(res.error, 160)}). Check the spelling.` } });
      return;
    }
    const entry = normalize(res, q);
    setSearch({ status: "done", query: q, entry, error: null, isExample: false, fromCage: false });
  } catch (e) {
    if (e && e.code === "cancelled") { setSearch({ status: "idle", query: "", entry: null, error: null, isExample: true }); return; }
    const code = (e && e.code) || "upstream_error";
    setSearch({ status: "error", query: q, entry: null, error: { code, message: ERR_COPY[code] || "The lookup didn’t finish. Check your connection and try again." } });
  }
}

function setSearch(s) {
  state.search = Object.assign({ status: "idle", query: "", entry: null, error: null, isExample: false, fromCage: false, offline: false, ctl: null }, s);
  renderSearch();
}

/* ---------- saving ---------- */
function newSrs() { return { due: Date.now(), interval: 0, ease: 2.5, reps: 0, lapses: 0, last: null }; }

async function addToCage(entry, subject, deck, quiet) {
  const id = idFor(entry.word);
  const now = Date.now();
  const existing = state.words.get(id);
  const w = Object.assign(clone(entry), {
    id, subject, deck: deck || "",
    notes: existing ? existing.notes || "" : "",
    createdAt: existing ? existing.createdAt : now,
    updatedAt: now,
    srs: existing && existing.srs ? existing.srs : newSrs()
  });
  delete w.correctedFrom;
  await store.saveWord(w);
  if (!quiet) toast(existing ? `Updated “${w.word}”` : `Added “${w.word}” to your cage`);
  return w;
}

async function ensureDeck(name) {
  const n = name.trim().slice(0, 40);
  if (!n) return "";
  const found = state.meta.decks.find((d) => d.name.toLowerCase() === n.toLowerCase());
  if (found) return found.id;
  const d = { id: "d" + Date.now().toString(36), name: n };
  const m = clone(state.meta); m.decks = [...(m.decks || []), d];
  await store.saveMeta(m);
  return d.id;
}
const deckName = (id) => (state.meta.decks.find((d) => d.id === id) || {}).name || "";

/* ---------- rendering: card ---------- */
const speakSupported = "speechSynthesis" in window;
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const v = voices.find((x) => x.lang === "en-GB") || voices.find((x) => (x.lang || "").startsWith("en"));
    if (v) u.voice = v;
    u.lang = v ? v.lang : "en-GB";
    u.rate = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) { toast("This browser can’t read words aloud."); }
}
const speakerIcon = () => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  s.innerHTML = '<path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
  return s;
};

function headword(e) {
  const flat = e.word.toLowerCase().replace(/[\s\-']/g, "");
  const joined = e.parts.map((p) => p.text.toLowerCase()).join("");
  if (e.parts.length > 1 && flat === joined) {
    let i = 0;
    const src = e.word.replace(/[\s\-']/g, "");
    return h("h2", { class: "headword" }, e.parts.map((p) => {
      const seg = src.slice(i, i + p.text.length); i += p.text.length;
      return h("span", { class: "hseg hseg-" + partClass(p.type), title: `${partLabel(p)}: ${p.meaning}` }, seg);
    }));
  }
  return h("h2", { class: "headword" }, e.word);
}

function highlight(sentence, word) {
  const stem = word.length > 5 ? word.slice(0, Math.max(4, word.length - 2)) : word;
  const re = new RegExp("(" + escRe(stem) + "[a-z]*)", "ig");
  const out = []; let last = 0, m;
  while ((m = re.exec(sentence))) {
    out.push(sentence.slice(last, m.index), h("b", null, m[1]));
    last = m.index + m[1].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  out.push(sentence.slice(last));
  return out;
}

function renderCard(e, opts) {
  const o = opts || {};
  const head = h("div", { class: "card-head" },
    h("div", { class: "tagrow" },
      o.example ? h("span", { class: "tag plain" }, "Example card") : null,
      h("span", { class: "tag" }, e.subject || "General"),
      e.field ? h("span", { class: "tag plain" }, e.field) : null,
      e.status === "draft" ? h("span", { class: "tag draft" }, "Draft · needs AI check") : null,
      e.deck && deckName(e.deck) ? h("span", { class: "tag plain" }, "Deck: " + deckName(e.deck)) : null
    ),
    headword(e),
    h("div", { class: "pron" },
      e.ipa ? h("span", { class: "ipa" }, e.ipa) : null,
      speakSupported ? h("button", { class: "speak", type: "button", "aria-label": "Play pronunciation of " + e.word, onclick: () => speak(e.word) }, speakerIcon()) : null,
      e.pos ? h("span", { class: "pos" }, e.pos) : null
    ),
    e.correctedFrom ? h("div", { class: "corrected" }, `Showing “${e.word}”. You typed “${e.correctedFrom}”.`) : null
  );

  const secs = [];
  if (e.parts.length) {
    const strip = h("div", { class: "strip" });
    e.parts.forEach((p, i) => {
      if (i) add(strip, h("span", { class: "plus", "aria-hidden": "true" }, "+"));
      add(strip, h("div", { class: "morph " + partClass(p.type) },
        h("span", { class: "mk" }, p.type),
        h("span", { class: "mt" }, partLabel(p)),
        p.meaning ? h("span", { class: "mm" }, p.meaning) : null,
        p.origin ? h("span", { class: "mo" }, p.origin) : null));
    });
    secs.push(h("section", { class: "sec" },
      h("h3", { class: "eyebrow" }, "Breakdown"), strip,
      e.literal ? h("div", { class: "literal" }, e.literal) : null));
  }

  if (e.definition || e.subjectMeaning || e.otherUses) {
    secs.push(h("section", { class: "sec" },
      h("h3", { class: "eyebrow" }, "Meaning"),
      e.definition ? h("p", { class: "def" }, e.definition) : null,
      e.subjectMeaning ? h("p", { class: "sub" }, h("b", null, "In " + (e.field || e.subject || "the field")), e.subjectMeaning) : null,
      e.otherUses ? h("p", { class: "sub" }, h("b", null, "Other uses"), e.otherUses) : null));
  }

  if (e.examples.length) {
    secs.push(h("section", { class: "sec" },
      h("h3", { class: "eyebrow" }, "Examples"),
      h("ul", { class: "ex" }, e.examples.map((x) => h("li", null, highlight(x, e.word))))));
  }

  if (!o.compact && (e.forms.length || e.synonyms.length)) {
    secs.push(h("section", { class: "sec" },
      h("dl", { class: "kv" },
        e.forms.length ? [h("dt", null, "Forms"), h("dd", null, h("div", { class: "formlist" }, e.forms.map((f) => h("span", null, f.form, f.label ? h("i", null, " (" + f.label + ")") : null))))] : null,
        e.synonyms.length ? [h("dt", null, "Similar"), h("dd", null, e.synonyms.join(", "))] : null)));
  }

  if (!o.compact && e.related.length) {
    secs.push(h("section", { class: "sec" },
      h("h3", { class: "eyebrow" }, "Same root, other words"),
      h("div", { class: "rel" }, e.related.map((r) => h("div", { class: "relrow" },
        h("span", { class: "relpart" }, r.part, r.meaning ? h("small", null, " " + r.meaning) : null),
        r.words.map((w) => h("button", { class: "chipbtn", type: "button", title: "Look up " + w, onclick: () => lookup(w) }, w)))))));
  }

  if (e.notes) {
    secs.push(h("section", { class: "sec" }, h("h3", { class: "eyebrow" }, "My notes"), h("p", { class: "notes" }, e.notes)));
  }

  if (!secs.length) {
    secs.push(h("section", { class: "sec" }, h("p", { class: "hint" }, "This draft only has the word so far. Use “Complete with AI” when you’re online.")));
  }

  return h("article", { class: "card" }, head, secs, o.foot || null);
}

/* deck <select> with a "new deck" option */
function deckSelect(id, current) {
  const sel = h("select", { id },
    h("option", { value: "" }, "No deck"),
    state.meta.decks.map((d) => h("option", { value: d.id }, d.name)),
    h("option", { value: "__new" }, "New deck…"));
  sel.value = current || "";
  return sel;
}
function subjectSelect(id, current) {
  const sel = h("select", { id }, SUBJECTS.map((s) => h("option", { value: s }, s)));
  sel.value = SUBJECTS.includes(current) ? current : "General";
  return sel;
}

/* ---------- rendering: search ---------- */
function renderSearch() {
  const out = $("search-out");
  out.replaceChildren();
  const s = state.search;

  if (s.status === "loading") {
    add(out, h("div", { class: "card" }, h("div", { class: "loading" },
      h("div", { class: "eyebrow" }, "Looking up"),
      h("div", { class: "headword" }, s.query),
      h("div", { class: "ghostrow", "aria-hidden": "true" }, h("span"), h("span"), h("span")),
      h("p", { class: "hint" }, "Claude is splitting the word into its parts and writing the card. This usually takes 10 to 30 seconds. The first lookup asks your permission to use Claude."),
      h("div", null, h("button", { class: "btn", type: "button", onclick: () => s.ctl && s.ctl.abort() }, "Stop")))));
    return;
  }

  if (s.status === "error") {
    const code = s.error.code;
    const canRetry = !["format", "notword", "unavailable", "not_granted", "sampling_disabled"].includes(code);
    const canDraft = !["format", "notword"].includes(code) && s.query && !state.words.has(idFor(s.query));
    add(out, h("div", { class: "notice warn", role: "alert" },
      h("strong", null, s.error.message),
      canRetry ? h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: () => { state.search.forceAI = s.query; lookup(s.query); } }, "Try again")) : null));
    if (canDraft) {
      const d = draftFromDictionary(s.query);
      add(out, h("p", { class: "hint", style: "margin:0" }, "Meanwhile, here is a quick breakdown from the built-in roots list. You can save it as a draft and complete it with AI later."));
      add(out, renderCard(d, { foot: saveFoot(d, false) }));
    } else add(out, trySuggestions());
    return;
  }

  if (s.status === "done" && s.entry) {
    if (s.offline) add(out, h("div", { class: "notice" },
      h("strong", null, "AI lookups need the online app"),
      h("span", { class: "hint" }, s.entry.parts.length
        ? "This quick breakdown comes from the built-in roots list. Save it as a draft. When you’re back online, import it into the online app and tap “Complete drafts with AI”."
        : "This word isn’t in the built-in roots list. You can still save it as a draft and add the meaning yourself, or complete it with AI later.")));
    add(out, renderCard(s.entry, { foot: saveFoot(s.entry, false) }));
    return;
  }

  // idle: example card + suggestions
  add(out, trySuggestions());
  add(out, renderCard(EXAMPLE, { example: true, foot: saveFoot(EXAMPLE, true) }));
}

function trySuggestions() {
  return h("div", { class: "try" }, h("span", { class: "hint" }, "Try:"),
    TRY_WORDS.map((w) => h("button", { class: "chipbtn", type: "button", onclick: () => lookup(w) }, w)));
}

function saveFoot(entry, isExample) {
  const id = idFor(entry.word);
  const existing = state.words.get(id);
  const fromCage = !isExample && state.search.fromCage;
  const foot = h("div", { class: "card-foot" });

  if (fromCage && existing) {
    add(foot, 
      h("span", { class: "saved-pill" }, "✓ In your cage"),
      h("span", { class: "grow" }),
      h("button", { class: "btn ghost", type: "button", onclick: () => { state.search.forceAI = entry.word; lookup(entry.word); } }, "Look up again with AI"),
      h("button", { class: "btn", type: "button", onclick: () => openDetail(id) }, "Open"));
    return foot;
  }

  const subj = subjectSelect("save-subject", entry.subject);
  const deck = deckSelect("save-deck", existing ? existing.deck : (state.lastDeck || ""));
  const newDeck = h("input", { id: "save-newdeck", type: "text", placeholder: "Deck name", hidden: true, maxlength: "40" });
  deck.addEventListener("change", () => { newDeck.hidden = deck.value !== "__new"; if (!newDeck.hidden) newDeck.focus(); });
  const btn = h("button", { class: "btn primary", type: "button" }, entry.status === "draft" ? "Save as draft" : existing ? "Update saved card" : "Add to cage");
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    try {
      let deckId = deck.value;
      if (deckId === "__new") deckId = await ensureDeck(newDeck.value);
      state.lastDeck = deckId;
      await addToCage(entry, subj.value, deckId);
      state.search.fromCage = true;
      renderSearch();
    } catch (e) { btn.disabled = false; }
  });
  add(foot, ...[
    h("label", { for: "save-subject" }, "Subject", subj),
    h("label", { for: "save-deck" }, "Deck", deck), newDeck,

/* ---------- rendering: cage ---------- */
function filteredWords() {
  const q = $("cage-q").value.trim().toLowerCase();
  const subj = $("cage-subject").value, deck = $("cage-deck").value, st = $("cage-status").value, sort = $("cage-sort").value;
  let list = [...state.words.values()];
  if (q) list = list.filter((w) => w.word.toLowerCase().includes(q) || (w.definition || "").toLowerCase().includes(q) || (w.parts || []).some((p) => p.text.toLowerCase().includes(q) || (p.meaning || "").toLowerCase().includes(q)));
  if (subj) list = list.filter((w) => w.subject === subj);
  if (deck === "__none") list = list.filter((w) => !w.deck);
  else if (deck) list = list.filter((w) => w.deck === deck);
  if (st === "due") list = list.filter(isDue);
  else if (st) list = list.filter((w) => (w.status || "complete") === st);
  const az = (a, b) => a.word.localeCompare(b.word);
  if (sort === "az") list.sort(az);
  else if (sort === "subject") list.sort((a, b) => (a.subject || "").localeCompare(b.subject || "") || az(a, b));
  else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return list;
}

/* ---------- spaced repetition ---------- */
const DAY = 86400000;
function startOfDay(t) { const d = new Date(t == null ? Date.now() : t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function endOfToday() { return startOfDay() + DAY - 1; }
function srsOf(w) { return Object.assign({ due: w.createdAt || 0, interval: 0, ease: 2.5, reps: 0, lapses: 0, last: null }, w.srs || {}); }
function isDue(w) { return srsOf(w).due <= endOfToday(); }
function isNew(w) { const s = srsOf(w); return !s.last; }
function settings() { return Object.assign({ dailyLimit: 10, direction: "word" }, state.meta.settings || {}); }

// SM-2 style: Good goes 1 → 3 → 7 days, then multiplies by the card's ease (starts at 2.5).
function schedule(s0, grade, now) {
  const t = now == null ? Date.now() : now;
  const s = Object.assign({}, s0);
  if (grade === "again") {
    s.lapses = (s.lapses || 0) + 1; s.reps = 0; s.ease = Math.max(1.3, s.ease - 0.2); s.interval = 0; s.due = t; s.last = t;
    return s;
  }
  let iv;
  if (grade === "hard") {
    iv = s.reps === 0 ? 1 : Math.max(s.interval + 1, Math.round(s.interval * 1.2));
    s.ease = Math.max(1.3, s.ease - 0.15);
  } else if (grade === "good") {
    iv = s.reps === 0 ? 1 : s.reps === 1 ? 3 : s.reps === 2 ? 7 : Math.max(s.interval + 1, Math.round(s.interval * s.ease));
  } else {
    iv = s.reps === 0 ? 3 : s.reps === 1 ? 7 : Math.max(s.interval + 2, Math.round(s.interval * s.ease * 1.3));
    s.ease = s.ease + 0.15;
  }
  iv = Math.min(iv, 365);
  s.interval = iv; s.reps = s.reps + 1; s.due = startOfDay(t) + iv * DAY; s.last = t;
  return s;
}
function ivText(days) {
  if (days <= 0) return "again today";
  if (days === 1) return "1 day";
  if (days < 30) return days + " days";
  if (days < 365) { const m = Math.round(days / 30); return m + (m === 1 ? " month" : " months"); }
  return "1 year";
}
function nextReviewText(w) {
  const s = srsOf(w);
  if (!s.last) return "Not reviewed yet";
  if (s.due <= endOfToday()) return "Due for review today";
  const d = Math.round((s.due - startOfDay()) / DAY);
  return "Next review in " + ivText(d);
}
function reviewedToday() {
  const t0 = startOfDay(); let n = 0;
  for (const w of state.words.values()) { const s = srsOf(w); if (s.last && s.last >= t0) n++; }
  return n;
}
function reviewPool() {
  const deck = state.reviewDeck || "";
  return [...state.words.values()].filter((w) => !deck || (deck === "__none" ? !w.deck : w.deck === deck));
}
function dueSorted() {
  return reviewPool().filter(isDue).sort((a, b) => {
    const na = isNew(a), nb = isNew(b);
    if (na !== nb) return na ? 1 : -1;            // reviews before new cards
    return na ? (a.createdAt || 0) - (b.createdAt || 0) : srsOf(a).due - srsOf(b).due;
  });
}
function roomToday() {
  const lim = settings().dailyLimit;
  return lim ? Math.max(0, lim - reviewedToday()) : Infinity;
}
function todaysQueue() { return dueSorted().slice(0, roomToday()).map((w) => w.id); }

state.review = { active: false, queue: [], i: 0, flipped: false, counts: { again: 0, hard: 0, good: 0, easy: 0 }, undo: null, finished: false };
state.reviewDeck = "";

function startSession(ids) {
  if (!ids.length) return;
  state.review = { active: true, queue: ids.slice(), i: 0, flipped: false, counts: { again: 0, hard: 0, good: 0, easy: 0 }, undo: null, finished: false };
  renderReview();
  window.scrollTo({ top: 0 });
}
function endSession() { state.review.active = false; state.review.finished = false; renderReview(); }

function currentWord() {
  const r = state.review;
  while (r.i < r.queue.length && !state.words.get(r.queue[r.i])) r.i++;   // skip deleted words
  return r.i < r.queue.length ? state.words.get(r.queue[r.i]) : null;
}

function rate(grade) {
  const r = state.review, w = currentWord();
  if (!w || !r.flipped) return;
  const prev = srsOf(w);
  const next = schedule(prev, grade);
  r.undo = { id: w.id, prev: w.srs ? clone(w.srs) : null, grade, queue: r.queue.slice(), i: r.i };
  r.counts[grade]++;
  if (grade === "again") r.queue.splice(Math.min(r.i + 4, r.queue.length), 0, w.id);
  r.i++; r.flipped = false;
  if (r.i >= r.queue.length) r.finished = true;
  const c = clone(w); c.srs = next;
  store.saveWord(c).catch(() => {});
  renderReview();
}
function undoRate() {
  const r = state.review, u = r.undo;
  if (!u) return;
  const w = state.words.get(u.id);
  if (w) { const c = clone(w); if (u.prev) c.srs = u.prev; else delete c.srs; store.saveWord(c).catch(() => {}); }
  r.queue = u.queue; r.i = u.i; r.counts[u.grade]--; r.flipped = true; r.finished = false; r.undo = null;
  renderReview();
}

function maskWord(text, word) {
  const stem = word.length > 5 ? word.slice(0, Math.max(4, word.length - 2)) : word;
  const re = new RegExp(escRe(stem) + "[a-z]*", "ig");
  const out = []; let last = 0, m;
  while ((m = re.exec(text))) { out.push(text.slice(last, m.index), h("span", { class: "mask" }, "_____")); last = m.index + m[0].length; if (!m[0].length) re.lastIndex++; }
  out.push(text.slice(last));
  return out;
}

function renderReview() {
  $("review-count").textContent = state.ready ? Math.min(dueSorted().length, roomToday()) : 0;
  $("review-count").hidden = !Number($("review-count").textContent);
  const view = $("view-review");
  if (state.view !== "review") return;
  view.replaceChildren();
  const r = state.review;

  if (!state.ready) { add(view, h("div", { class: "empty" }, h("p", null, "Opening your cage…"))); return; }

  if (r.active && !r.finished) {
    const w = currentWord();
    if (!w) { r.finished = true; return renderReview(); }
    const done = r.i, total = r.queue.length;
    add(view, h("div", { class: "sessionbar" },
      h("button", { class: "btn ghost", type: "button", onclick: endSession }, "End"),
      h("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(done) }, h("i", { style: `width:${Math.round(done / total * 100)}%` })),
      h("span", { class: "count" }, `${done} / ${total}`),
      r.undo ? h("button", { class: "btn ghost", type: "button", onclick: undoRate }, "Undo") : null));

    if (!r.flipped) {
      const meaningFirst = settings().direction === "meaning" && (w.definition || w.subjectMeaning);
      const front = h("button", { class: "flash card", type: "button", "aria-label": "Show answer", onclick: () => { r.flipped = true; renderReview(); } },
        h("div", { class: "tagrow", style: "justify-content:center" },
          h("span", { class: "tag" }, w.subject || "General"),
          w.field ? h("span", { class: "tag plain" }, w.field) : null,

/* ---------- quiz ---------- */
const QUIZ_TYPES = [
  { id: "mixed", label: "Mixed" },
  { id: "meaning", label: "Pick the meaning" },
  { id: "word", label: "Pick the word" },
  { id: "type", label: "Type the word" },
  { id: "root", label: "What does this part mean?" },
  { id: "guess", label: "Guess new words from their parts" }
];
const PRACTICE_WORDS = ["bradycardia", "hepatitis", "nephrectomy", "gastroenteritis", "osteomalacia", "hyperglycemia", "leukocyte", "erythrocyte", "dermatology", "neuralgia", "arthroplasty", "rhinoplasty", "cardiomegaly", "hemiplegia", "polyuria", "dyspnea", "tachypnea", "thermometer", "hydrometer", "microscope", "endoscopy", "cytology", "hematoma", "lipoma", "osteoma", "pathology", "myalgia", "encephalitis", "hypothermia", "bronchoscopy", "nephrology", "neurology", "thrombocyte", "angioplasty", "colectomy", "gastrectomy", "dermatitis", "splenomegaly", "geothermal", "hydraulic", "isotope", "magnetometer", "barometer", "seismograph", "telescope", "photometer", "arthritis", "cholecystectomy", "hypoglycemia", "neuropathy", "osteoporosis", "otitis", "rhinitis", "tonsillitis", "pericarditis", "endocarditis", "hepatomegaly", "thermostat", "gastroscopy", "microcyte"];

state.quiz = { active: false, finished: false, qs: [], i: 0, answered: null, score: 0, type: "mixed", len: 10, deck: "" };

const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const firstSentence = (t) => { const m = String(t || "").match(/^.*?[.!?](\s|$)/); return (m ? m[0] : String(t || "")).trim(); };
const shortDef = (w) => firstSentence(w.definition || w.subjectMeaning);
const firstMeaning = (m) => String(m || "").split(/[;,]/)[0].trim();
const normWord = (t) => String(t).toLowerCase().replace(/[^a-z]/g, "");

function quizPool() {
  const deck = state.quiz.deck;
  return [...state.words.values()].filter((w) => (w.definition || w.subjectMeaning) && (!deck || (deck === "__none" ? !w.deck : w.deck === deck)));
}
function rootQuizEntries() {
  const mine = shuffle(myRootIndex().filter((e) => e.meaning));
  const dict = shuffle(ROOTS.list.filter((e) => e.text.length > 2)).map((e) => ({ key: e.text + "|" + e.type, type: e.type, label: partLabel(e), text: e.text, meaning: e.meaning, origin: e.origin, words: [] }));
  return mine.concat(dict);
}
function guessCandidates() {
  const inCage = new Set([...state.words.values()].map((w) => normWord(w.word)));
  const names = new Set();
  for (const w of state.words.values()) for (const r of (w.related || [])) for (const x of r.words) names.add(x.toLowerCase());
  for (const x of PRACTICE_WORDS) names.add(x);
  const out = [], glosses = new Set();
  for (const name of names) {
    if (!/^[a-z]+$/.test(name) || inCage.has(name)) continue;
    const seg = segment(name);
    if (!seg || !seg.complete || seg.parts.length < 2 || seg.parts.some((p) => !p.meaning)) continue;
    const gloss = glossOf(seg.parts);
    if (glosses.has(gloss)) continue;
    glosses.add(gloss);
    out.push({ word: name, parts: seg.parts, gloss, fromCage: !PRACTICE_WORDS.includes(name) });
  }
  // words met through saved cards first
  return shuffle(out.filter((c) => c.fromCage)).concat(shuffle(out.filter((c) => !c.fromCage)));
}

function maskedDef(w) { return maskWord(shortDef(w), w.word); }

function makeQuestion(kind, ctx) {
  const { pool } = ctx;
  if (kind === "meaning" || kind === "word" || kind === "type") {
    const w = ctx.nextWord();
    if (!w) return null;
    if (kind === "type") {
      return { kind, key: kind + w.id, word: w, answer: w.word,
        prompt: [h("span", { class: "eyebrow" }, "Type the word that means"), h("span", null, maskedDef(w))],
        hint: `Starts with “${w.word[0]}”, ${w.word.replace(/[^A-Za-z]/g, "").length} letters` + ((w.parts || []).length > 1 ? " · parts: " + w.parts.map((p) => firstMeaning(p.meaning) || "?").join(" + ") : "") };
    }
    const others = shuffle(pool.filter((x) => x.id !== w.id && shortDef(x) !== shortDef(w))).slice(0, 3);
    if (others.length < 3) return null;
    if (kind === "meaning") {
      return { kind, key: kind + w.id, word: w, optClass: "",
        prompt: [h("span", { class: "eyebrow" }, "What does this word mean?"), h("span", { class: "big" }, w.word)],
        opts: shuffle([{ text: shortDef(w), right: true }].concat(others.map((o) => ({ text: shortDef(o) })))) };
    }
    return { kind, key: kind + w.id, word: w, optClass: "word",
      prompt: [h("span", { class: "eyebrow" }, "Which word means…"), h("span", null, maskedDef(w))],
      opts: shuffle([{ text: w.word, right: true }].concat(others.map((o) => ({ text: o.word })))) };
  }
  if (kind === "root") {
    const e = ctx.nextRoot();
    if (!e) return null;
    const right = firstMeaning(e.meaning);
    const used = new Set([right.toLowerCase()]);
    const distract = [];
    for (const d of shuffle(ROOTS.list)) {
      const m = firstMeaning(d.meaning);
      if (used.has(m.toLowerCase()) || d.text === e.text) continue;
      if (distract.length < 2 && d.type !== e.type) continue;   // mostly same kind of part
      used.add(m.toLowerCase()); distract.push(m);
      if (distract.length === 3) break;
    }
    const example = e.words.length ? e.words[0].word : "";
    return { kind, key: "root" + e.key, root: e, optClass: "",
      prompt: [h("span", { class: "eyebrow" }, `What does this ${e.type === "root" ? "root" : e.type} mean?`), h("span", { class: "big" }, e.label), example ? h("span", { class: "hint" }, `as in ${example}`) : null],
      opts: shuffle([{ text: right, right: true }].concat(distract.map((t) => ({ text: t })))) };
  }
  if (kind === "guess") {
    const c = ctx.nextGuess();
    if (!c) return null;
    const others = shuffle(ctx.guess.filter((x) => x.word !== c.word)).slice(0, 3);
    if (others.length < 3) return null;
    return { kind, key: "guess" + c.word, cand: c, optClass: "",
      prompt: [h("span", { class: "eyebrow" }, "You haven’t saved this word. Use its parts to guess what it means."), h("span", { class: "big" }, c.word)],
      opts: shuffle([{ text: c.gloss, right: true }].concat(others.map((o) => ({ text: o.gloss })))) };

}

function availableQuizTypes() {
  const pool = quizPool();
  const t = [];
  if (pool.length >= 4) t.push("meaning", "word", "type");
  t.push("root");
  if (guessCandidates().length >= 4) t.push("guess");
  return t;
}

function buildQuiz(type, len) {
  const pool = quizPool();
  const words = shuffle(pool), roots = rootQuizEntries(), guess = guessCandidates();
  let wi = 0, ri = 0, gi = 0;
  const ctx = {
    pool, guess,
    nextWord: () => words.length ? words[(wi++) % words.length] : null,
    nextRoot: () => roots.length ? roots[(ri++) % roots.length] : null,
    nextGuess: () => guess.length ? guess[(gi++) % guess.length] : null
  };
  const kinds = type === "mixed" ? availableQuizTypes() : [type];
  const qs = [], keys = new Set();
  for (let k = 0; k < len * 6 && qs.length < len; k++) {
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    const q = makeQuestion(kind, ctx);
    if (q && !keys.has(q.key)) { keys.add(q.key); qs.push(q); }
  }
  return qs;
}

function startQuiz() {
  const z = state.quiz;
  const qs = buildQuiz(z.type, z.len);
  if (!qs.length) { toast("Not enough words for this quiz yet."); return; }
  Object.assign(z, { active: true, finished: false, qs, i: 0, answered: null, score: 0 });

}

function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

function answerQuiz(choice) {
  const z = state.quiz, q = z.qs[z.i];
  if (!q || z.answered) return;
  let right, note = "";
  if (q.kind === "type") {
    const a = normWord(choice), b = normWord(q.answer);
    if (!a) return;
    right = a === b;
    if (!right && b.length >= 6 && editDistance(a, b) === 1) { right = true; note = `Almost. The spelling is “${q.answer}”.`; }
  } else {
    right = !!q.opts[choice].right;
  }
  q.result = { right, choice, note };
  if (right) z.score++;
  z.answered = true;
  renderQuiz();
}
function nextQuiz() {

  z.i++; z.answered = null;

/* ---------- roots library ---------- */
state.rootsMode = "mine";
function rootKey(p) {
  const t = String(p.text).toLowerCase().replace(/^-+|-+$/g, "");
  const type = p.type === "combining form" ? "root" : p.type;
  return (p.type === "combining form" ? t.replace(/[oi]$/, "") : t) + "|" + type;
}
function myRootIndex() {
  const map = new Map();
  for (const w of state.words.values()) for (const p of (w.parts || [])) {
    if (!p.text) continue;
    const key = rootKey(p);
    let e = map.get(key);
    if (!e) {
      const d = dictLookup(p.text, p.type);
      e = { key, type: p.type === "combining form" ? "root" : p.type, label: partLabel(p), text: p.text.toLowerCase(), meaning: p.meaning || (d ? d.meaning : ""), origin: p.origin || (d ? d.origin : ""), words: [], more: new Set() };
      map.set(key, e);
    }
    if (!e.meaning && p.meaning) e.meaning = p.meaning;
    if (!e.origin && p.origin) e.origin = p.origin;
    if (!e.words.some((x) => x.id === w.id)) e.words.push({ id: w.id, word: w.word });
  }
  const saved = new Set([...state.words.values()].map((w) => w.word.toLowerCase()));
  for (const w of state.words.values()) for (const r of (w.related || [])) {
    const t = r.part.toLowerCase().replace(/[^a-z]/g, "");
    for (const e of map.values()) {
      if (e.text.replace(/[^a-z]/g, "") === t || e.key.split("|")[0] === t) for (const x of r.words) if (!saved.has(x.toLowerCase())) e.more.add(x);
    }
  }
  return [...map.values()];
}

function renderRoots() {
  if (state.view !== "roots") return;
  const mine = state.rootsMode === "mine";
  $("roots-mine").setAttribute("aria-pressed", String(mine));
  $("roots-all").setAttribute("aria-pressed", String(!mine));
  const q = $("roots-q").value.trim().toLowerCase().replace(/^-+|-+$/g, "");
  const type = $("roots-type").value, sort = $("roots-sort").value;
  const myIdx = myRootIndex();
  let list;
  if (mine) list = myIdx;
  else {
    const byKey = new Map(myIdx.map((e) => [e.key, e]));
    list = ROOTS.list.map((d) => {
      const m = byKey.get(rootKey(d));
      return { key: d.text + "|" + d.type, type: d.type, label: partLabel(d), text: d.text, meaning: d.meaning, origin: d.origin, words: m ? m.words : [], more: new Set() };
    });
  }
  if (type) list = list.filter((e) => e.type === type);
  if (q) list = list.filter((e) => e.text.includes(q) || e.meaning.toLowerCase().includes(q) || e.words.some((x) => x.word.toLowerCase().includes(q)));
  list.sort(sort === "az" || !mine ? ((a, b) => a.text.localeCompare(b.text)) : ((a, b) => b.words.length - a.words.length || a.text.localeCompare(b.text)));
  if (!mine && sort === "count") list.sort((a, b) => b.words.length - a.words.length || a.text.localeCompare(b.text));

  const counts = { prefix: 0, root: 0, suffix: 0 };
  for (const e of myIdx) counts[e.type] = (counts[e.type] || 0) + 1;
  $("roots-summary").textContent = mine
    ? `${myIdx.length} parts met so far · ${counts.prefix} prefixes · ${counts.root} roots · ${counts.suffix} suffixes`
    : `${ROOTS.list.length} common parts built in · works offline`;

  const box = $("roots-list");
  box.replaceChildren();
  if (!state.ready) { add(box, h("div", { class: "empty" }, h("p", null, "Opening your cage…"))); return; }
  if (mine && !myIdx.length) {
    add(box, h("div", { class: "empty" },
      h("h2", null, "No roots yet"),
      h("p", null, "Every word you save adds its prefixes, roots and suffixes here. Meanwhile, browse the built-in list."),
      h("button", { class: "btn primary", type: "button", onclick: () => { state.rootsMode = "all"; renderRoots(); } }, "Browse common roots")));
    return;
  }
  if (!list.length) { add(box, h("div", { class: "empty" }, h("p", null, "No parts match this search."))); return; }
  const shown = list.slice(0, 400);
  add(box, h("div", { class: "list" }, shown.map((e) => h("div", { class: "rootrow" },
    h("span", { class: "rl " + e.type }, e.label),
    h("div", { class: "rm" },
      h("span", null, e.meaning || h("span", { class: "hint" }, "Meaning not known yet")),
      e.origin ? h("span", { class: "ro" }, e.origin) : null,
      e.words.length ? h("div", { class: "rw" }, e.words.map((x) => h("button", { class: "chipbtn", type: "button", onclick: () => openDetail(x.id) }, x.word))) : null,
      e.more && e.more.size ? h("div", { class: "rw" }, h("span", { class: "hint" }, "Also:"), [...e.more].slice(0, 6).map((x) => h("button", { class: "chipbtn", type: "button", title: "Look up " + x, onclick: () => lookup(x) }, x))) : null)))));
  if (list.length > shown.length) add(box, h("p", { class: "hint" }, `Showing the first ${shown.length}. Search to narrow the list.`));
}

/* ---------- backup, import, drafts ---------- */
state.settings = { busy: false, importMsg: "", exportText: "", pasteText: "", draftRun: null, draftMsg: "" };
const BACKUP_KEY = "vocabcage.lastBackup";
function lastBackup() { try { return Number(localStorage.getItem(BACKUP_KEY)) || 0; } catch (e) { return 0; } }
function markBackup() { try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) {} }

function exportData() {
  return JSON.stringify({ app: "vocab-cage", version: 1, exportedAt: new Date().toISOString(), from: OFFLINE ? "phone" : "online",
    meta: { decks: state.meta.decks || [], settings: state.meta.settings || {} }, words: [...state.words.values()] });
}
function backupName() { return `vocab-cage-${OFFLINE ? "phone" : "online"}-${new Date().toISOString().slice(0, 10)}.json`; }

async function saveBackupFile() {
  const data = exportData(), name = backupName();
  if (!OFFLINE && window.claude && typeof window.claude.use === "function") {
    let dl = null;
    try { dl = await window.claude.use("downloads"); } catch (e) {}
    if (dl) {
      try { await dl.save({ filename: name, data }); markBackup(); toast("Backup file saved"); renderSettings(); return; }
      catch (e) { if (e && e.code === "declined") return; }
    }
    state.settings.exportText = data; renderSettings();
    toast("Saving files isn’t available here. Copy the text below instead.");
    return;
  }
  try {
    const file = new File([data], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Vocab Cage backup" });
      markBackup(); renderSettings(); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = h("a", { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markBackup(); toast("Backup file saved"); renderSettings();
  } catch (e) { state.settings.exportText = data; renderSettings(); }
}
async function copyBackup(btn) {
  const data = exportData();
  try { await navigator.clipboard.writeText(data); markBackup(); toast(`Copied ${state.words.size} words. Paste them into the other app’s Import box.`); renderSettings(); }
  catch (e) { state.settings.exportText = data; renderSettings(); toast("Select the text below and copy it."); }
}

const num = (v) => (typeof v === "number" && isFinite(v) ? v : 0);
function sanitizeWord(x) {
  if (!x || typeof x !== "object" || typeof x.word !== "string" || !x.word.trim()) return null;
  const w = normalize(x, x.word.trim());
  w.word = str(x.word, 80);
  Object.assign(w, {
    id: idFor(w.word),
    subject: SUBJECTS.includes(x.subject) ? x.subject : w.subject,
    deck: typeof x.deck === "string" ? x.deck.slice(0, 60) : "",
    notes: str(x.notes, 2000),
    status: x.status === "draft" ? "draft" : "complete",
    createdAt: num(x.createdAt) || Date.now(),
    updatedAt: num(x.updatedAt)
  });
  if (x.srs && typeof x.srs === "object") {
    w.srs = { due: num(x.srs.due), interval: num(x.srs.interval), ease: num(x.srs.ease) || 2.5, reps: num(x.srs.reps), lapses: num(x.srs.lapses), last: num(x.srs.last) || null };
  }
  delete w.correctedFrom;
  return w;
}
function stableJSON(o) {
  return JSON.stringify(o, (k, v) => (v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, key) => { a[key] = v[key]; return a; }, {}) : v));
}
function mergeWord(cur, inc) {
  const content = cur.status !== "draft" && inc.status === "draft" ? cur
    : cur.status === "draft" && inc.status !== "draft" ? inc
    : (inc.updatedAt || 0) > (cur.updatedAt || 0) ? inc : cur;
  const m = clone(content);
  const sa = srsOf(cur), sb = srsOf(inc);
  if ((sb.last || 0) > (sa.last || 0)) m.srs = clone(inc.srs); else if (cur.srs) m.srs = clone(cur.srs); else delete m.srs;
  const newer = (inc.updatedAt || 0) > (cur.updatedAt || 0) ? inc : cur, older = newer === inc ? cur : inc;
  m.notes = newer.notes || older.notes || "";
  m.deck = content.deck || cur.deck || inc.deck || "";
  m.createdAt = Math.min(cur.createdAt || Date.now(), inc.createdAt || Date.now());
  m.updatedAt = Math.max(cur.updatedAt || 0, inc.updatedAt || 0);
  m.id = cur.id;
  return m;
}

async function runImport(text) {
  const S = state.settings;
  let data;
  try { data = JSON.parse(String(text).trim()); } catch (e) { S.importMsg = "That isn’t a Vocab Cage backup. Use a file or text made with Save backup file or Copy as text."; renderSettings(); return; }
  if (!data || data.app !== "vocab-cage" || !Array.isArray(data.words)) { S.importMsg = "That isn’t a Vocab Cage backup. Use a file or text made with Save backup file or Copy as text."; renderSettings(); return; }

  // decks: match by id, then by name
  const meta = clone(state.meta); meta.decks = meta.decks || [];
  const deckMap = {};
  let decksChanged = false;
  for (const d of (data.meta && Array.isArray(data.meta.decks) ? data.meta.decks : [])) {
    if (!d || typeof d.id !== "string" || typeof d.name !== "string") continue;
    const byId = meta.decks.find((x) => x.id === d.id);
    const byName = meta.decks.find((x) => x.name.toLowerCase() === d.name.toLowerCase());
    if (byId) deckMap[d.id] = byId.id;
    else if (byName) deckMap[d.id] = byName.id;
    else { meta.decks.push({ id: d.id.slice(0, 40), name: d.name.slice(0, 40) }); deckMap[d.id] = d.id.slice(0, 40); decksChanged = true; }
  }

  const writes = [];
  let added = 0, updated = 0, same = 0, skipped = 0;
  for (const raw of data.words) {
    const inc = sanitizeWord(raw);
    if (!inc) { skipped++; continue; }
    inc.deck = inc.deck ? (deckMap[inc.deck] || (meta.decks.some((x) => x.id === inc.deck) ? inc.deck : "")) : "";
    const cur = state.words.get(inc.id);
    if (!cur) { writes.push(inc); added++; continue; }
    const m = mergeWord(cur, inc);
    if (stableJSON(m) === stableJSON(cur)) same++;
    else { writes.push(m); updated++; }
  }
  S.busy = true;
  S.importMsg = `Saving ${writes.length} words…`;
  renderSettings(true);
  try {
    if (decksChanged) await store.saveMeta(meta);
    const res = writes.length ? await store.saveMany(writes, (n) => { const el = $("import-msg"); if (el) el.textContent = `Saving ${n} of ${writes.length}…`; }) : { saved: 0, failed: 0 };
    const drafts = [...state.words.values()].filter((w) => w.status === "draft").length;
    S.importMsg = `Done. ${added} new, ${updated} updated, ${same} unchanged` + (skipped ? `, ${skipped} skipped` : "") + (res.failed ? `, ${res.failed} couldn’t be saved` : "") + "." +
      (drafts && !OFFLINE ? ` ${drafts} ${drafts === 1 ? "draft is" : "drafts are"} ready to complete with AI below.` : "");
    S.pasteText = "";
    toast("Import finished");
  } catch (e) {
    S.importMsg = "The import stopped part-way. Check your connection and import the same file again; nothing will be duplicated.";
  }
  S.busy = false;
  renderSettings();
}

async function completeDrafts() {
  const S = state.settings;
  const sample = await getSample();
  if (!sample) { S.draftMsg = ERR_COPY.unavailable; renderSettings(); return; }
  const drafts = [...state.words.values()].filter((w) => w.status === "draft");
  if (!drafts.length) return;
  const ctl = new AbortController();
  S.draftRun = { done: 0, total: drafts.length, ctl, current: "" };
  S.busy = true; S.draftMsg = "";
  renderSettings(true);
  let ok = 0, failed = 0, stopMsg = "";
  for (const w of drafts) {
    if (ctl.signal.aborted) break;
    S.draftRun.current = w.word; updateDraftProgress();
    try {
      const res = await sample.json(buildPrompt(w.word.toLowerCase()), { signal: ctl.signal });
      if (res && typeof res === "object" && !res.error) {
        const e = normalize(res, w.word);
        const cur = state.words.get(w.id) || w;
        const c = Object.assign(clone(cur), e, { id: cur.id, word: cur.word, deck: cur.deck || "", notes: cur.notes || "", createdAt: cur.createdAt, updatedAt: Date.now(), status: "complete" });
        if (cur.srs) c.srs = clone(cur.srs); else delete c.srs;
        delete c.correctedFrom;
        await store.saveWord(c);
        ok++;
      } else failed++;
    } catch (e) {
      if (e && e.code === "cancelled") break;
      if (e && ["not_granted", "sampling_disabled", "rate_limited", "session_expired", "not_declared"].includes(e.code)) { stopMsg = ERR_COPY[e.code] || ""; break; }
      failed++;
    }
    S.draftRun.done++; updateDraftProgress();
  }
  S.draftRun = null; S.busy = false;
  S.draftMsg = `Completed ${ok} ${ok === 1 ? "draft" : "drafts"}` + (failed ? `, ${failed} couldn’t be completed (check their spelling)` : "") + "." + (stopMsg ? " " + stopMsg : "");
  renderSettings();
}
function updateDraftProgress() {
  const r = state.settings.draftRun, el = $("draft-progress");
  if (r && el) el.textContent = `${r.done} of ${r.total} done${r.current && r.done < r.total ? ` · now: ${r.current}` : ""}`;
}

    S.importMsg ? h("p", { class: "result", id: "import-msg", role: "status" }, S.importMsg) : h("p", { class: "result", id: "import-msg", role: "status" }));

    draftPanel = h("div", { class: "panel" },

        : h("p", { class: "hint" }, "Drafts are words saved without AI, for example on the plane. Claude fills in the meaning, examples and full breakdown. Your decks, notes and review progress stay."),
      !OFFLINE && S.draftRun

const VIEWS = ["search", "cage", "review", "quiz", "roots", "settings", "detail"];
const TABS = ["search", "cage", "review", "quiz", "roots", "settings"];
function showView(v) {

  if (v !== "detail") { state.editing = false; state.confirmDelete = false; }
  const changed = state.view !== v;
  state.view = v;
  for (const x of VIEWS) $("view-" + x).hidden = x !== v;
  for (const t of TABS) $("tab-" + t).setAttribute("aria-selected", String(t === v || (t === "cage" && v === "detail")));

function renderAll() {

  else { sync.textContent = "Connecting…"; sync.className = "sync"; }
  const cc = $("cage-count");
