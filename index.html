cid","f":"HNO3","name":"nitric acid","strength":"strong","anions":["NO3"],"note":"-ic acid ↔ -ate salt: nitric → nitrates.","protic":"monoprotic"},{"id":"nitrous-acid","f":"HNO2","name":"nitrous acid","strength":"weak","anions":["NO2"],"note":"-ous acid ↔ -ite salt: nitrous → nitrites.","protic":"monoprotic"},{"id":"sulfuric-acid","f":"H2SO4","name":"sulfuric acid","strength":"strong","anions":["HSO4","SO4"],"note":"Diprotic: first H⁺ is lost completely, the second only partly. Gives hydrogensulfates and sulfates.","protic":"diprotic"},{"id":"sulfurous-acid","f":"H2SO3","name":"sulfurous acid","strength":"weak","anions":["HSO3","SO3"],"note":"-ous → -ite: sulfites and hydrogensulfites.","protic":"diprotic"},{"id":"phosphoric-acid","f":"H3PO4","name":"phosphoric acid","strength":"weak","anions":["H2PO4","HPO4","PO4"],"note":"Triprotic: three salts, dihydrogenphosphate, hydrogenphosphate and phosphate.","protic":"triprotic"},{"id":"phosphonic-acid","f":"H3PO3","name":"phosphonic acid","strength":"weak","anions":["HPO3"],"note":"Has three H atoms but only two can be lost (one is bonded directly to P), so it is diprotic.","protic":"diprotic"},{"id":"carbonic-acid","f":"H2CO3","name":"carbonic acid","strength":"weak","anions":["HCO3","CO3"],"note":"Diprotic: hydrogencarbonates (bicarbonates) and carbonates.","protic":"diprotic"},{"id":"hypochlorous-acid","f":"HClO","name":"hypochlorous acid","strength":"weak","anions":["ClO"],"note":"hypo- … -ous ↔ hypo- … -ite.","protic":"monoprotic"},{"id":"chlorous-acid","f":"HClO2","name":"chlorous acid","strength":"weak","anions":["ClO2"],"note":"-ous ↔ -ite.","protic":"monoprotic"},{"id":"chloric-acid","f":"HClO3","name":"chloric acid","strength":"strong","anions":["ClO3"],"note":"-ic ↔ -ate.","protic":"monoprotic"},{"id":"perchloric-acid","f":"HClO4","name":"perchloric acid","strength":"strong","anions":["ClO4"],"note":"per- … -ic ↔ per- … -ate.","protic":"monoprotic"},{"id":"boric-acid","f":"H3BO3","name":"boric acid","strength":"weak","anions":["BO3"],"note":"A very weak acid; it actually works by accepting OH⁻ rather than releasing H⁺.","protic":"monoprotic"},{"id":"chromic-acid","f":"H2CrO4","name":"chromic acid","strength":"strong","anions":["CrO4"],"note":"-ic ↔ -ate: chromates.","protic":"monoprotic"},{"id":"permanganic-acid","f":"HMnO4","name":"permanganic acid","strength":"strong","anions":["MnO4"],"note":"per- … -ic ↔ per- … -ate: permanganates.","protic":"monoprotic"},{"id":"ethanoic-acid","f":"CH3COOH","name":"ethanoic acid","strength":"weak","anions":["CH3COO"],"note":"Organic acid: -oic acid ↔ -oate salt (ethanoic → ethanoate; acetic → acetate).","protic":"monoprotic"},{"id":"methanoic-acid","f":"HCOOH","name":"methanoic acid","strength":"weak","anions":["HCOO"],"note":"-oic ↔ -oate: methanoates (formates).","protic":"monoprotic"},{"id":"ethanedioic-acid","f":"H2C2O4","name":"ethanedioic acid","strength":"weak","anions":["C2O4"],"note":"Two acid groups (di-oic) → ethanedioates (oxalates).","protic":"monoprotic"}],"reacts":[{"f":"NaOH","kind":"hydroxide","cat":"Na","name":"sodium hydroxide","cid":"sodium-hydroxide"},{"f":"KOH","kind":"hydroxide","cat":"K","name":"potassium hydroxide","cid":"potassium-hydroxide"},{"f":"LiOH","kind":"hydroxide","cat":"Li","name":"lithium hydroxide","cid":"lithium-hydroxide"},{"f":"Ca(OH)2","kind":"hydroxide","cat":"Ca","name":"calcium hydroxide","cid":"calcium-hydroxide"},{"f":"Ba(OH)2","kind":"hydroxide","cat":"Ba","name":"barium hydroxide","cid":"barium-hydroxide"},{"f":"Mg(OH)2","kind":"hydroxide","cat":"Mg","name":"magnesium hydroxide","cid":"magnesium-hydroxide"},{"f":"Al(OH)3","kind":"hydroxide","cat":"Al","name":"aluminium hydroxide","cid":"aluminium-hydroxide"},{"f":"Cu(OH)2","kind":"hydroxide","cat":"Cu2","name":"copper(II) hydroxide","cid":"copper-ii-hydroxide"},{"f":"Zn(OH)2","kind":"hydroxide","cat":"Zn","name":"zinc hydroxide","cid":"zinc-hydroxide"},{"f":"Fe(OH)3","kind":"hydroxide","cat":"Fe3","name":"iron(III) hydroxide","cid":"iron-iii-hydroxide"},{"f":"NH3","kind":"ammonia","cat":"NH4","name":"ammonia","cid":"ammonia"},{"f":"MgO","kind":"oxide","cat":"Mg","name":"magnesium oxide","cid":"magnesium-oxide"},{"f":"CaO","kind":"oxide","cat":"Ca","name":"calcium oxide","cid":"calcium-oxide"},{"f":"CuO","kind":"oxide","cat":"Cu2","name":"copper(II) oxide","cid":"copper-ii-oxide"},{"f":"ZnO","kind":"oxide","cat":"Zn","name":"zinc oxide","cid":"zinc-oxide"},{"f":"Fe2O3","kind":"oxide","cat":"Fe3","name":"iron(III) oxide","cid":"iron-iii-oxide"},{"f":"Al2O3","kind":"oxide","cat":"Al","name":"aluminium oxide","cid":"aluminium-oxide"},{"f":"Na2CO3","kind":"carbonate","cat":"Na","name":"sodium carbonate","cid":"sodium-carbonate"},{"f":"K2CO3","kind":"carbonate","cat":"K","name":"potassium carbonate","cid":"potassium-carbonate"},{"f":"CaCO3","kind":"carbonate","cat":"Ca","name":"calcium carbonate","cid":"calcium-carbonate"},{"f":"MgCO3","kind":"carbonate","cat":"Mg","name":"magnesium carbonate","cid":"magnesium-carbonate"},{"f":"CuCO3","kind":"carbonate","cat":"Cu2","name":"copper(II) carbonate","cid":"copper-ii-carbonate"},{"f":"NaHCO3","kind":"hydrogencarbonate","cat":"Na","name":"sodium hydrogencarbonate","cid":"sodium-hydrogencarbonate"},{"f":"KHCO3","kind":"hydrogencarbonate","cat":"K","name":"potassium hydrogencarbonate","cid":"potassium-hydrogencarbonate"},{"f":"Mg","kind":"metal","cat":"Mg","name":"magnesium","cid":null},{"f":"Zn","kind":"metal","cat":"Zn","name":"zinc","cid":null},{"f":"Fe","kind":"metal","cat":"Fe2","name":"iron","cid":null},{"f":"Al","kind":"metal","cat":"Al","name":"aluminium","cid":null},{"f":"Ca","kind":"metal","cat":"Ca","name":"calcium","cid":null}],"lessons":[{"key":"cations","title":"Positive ions (cations)","body":["A metal ion keeps the element’s name: Na⁺ is sodium, Mg²⁺ is magnesium. You can say ‘sodium ion’.","Metals that form more than one ion get a Roman numeral for the charge, written straight after the name with no space: iron(II) is Fe²⁺, iron(III) is Fe³⁺. This is called Stock notation; say it ‘iron two’.","Older books use -ous for the lower charge and -ic for the higher one, often with the Latin stem: ferrous/ferric, cuprous/cupric, stannous/stannic, plumbous/plumbic.","Polyatomic cations end in -ium, copying the metals: ammonium NH₄⁺, oxonium H₃O⁺."],"rows":[["Fe²⁺","iron(II) · ferrous","lower charge → -ous"],["Fe³⁺","iron(III) · ferric","higher charge → -ic"],["Cu⁺","copper(I) · cuprous","Latin cuprum"],["Cu²⁺","copper(II) · cupric",""],["Sn⁴⁺","tin(IV) · stannic","Latin stannum"],["Pb²⁺","lead(II) · plumbous","Latin plumbum"],["NH₄⁺","ammonium","-ium like a metal"]],"morphs":["ous","ic","ium"],"terms":["cation","oxidation state","valency"]},{"key":"ide","title":"Simple negative ions: -ide","body":["A negative ion made of one element takes the stem of the element’s name plus -ide: chlorine → chloride, oxygen → oxide, sulfur → sulfide.","A compound of just two elements is also named with -ide, even when it is not ionic: hydrogen chloride, carbon dioxide.","Three polyatomic ions keep -ide by tradition: hydroxide OH⁻, cyanide CN⁻ and peroxide O₂²⁻."],"rows":[["F⁻","fluoride","fluor- + -ide"],["Cl⁻","chloride","chlor- + -ide"],["Br⁻","bromide",""],["I⁻","iodide",""],["O²⁻","oxide","ox- + -ide"],["S²⁻","sulfide","sulf- + -ide"],["N³⁻","nitride","nitr- + -ide"],["P³⁻","phosphide",""],["H⁻","hydride","hydr- + -ide"],["OH⁻","hydroxide","hydr + ox + -ide"],["CN⁻","cyanide","exception: polyatomic but -ide"]],"morphs":["ide"],"terms":["anion","binary compound"]},{"key":"oxy","title":"Oxyanions: -ate, -ite, per-, hypo-","body":["Ions that contain oxygen plus another element are oxyanions. The form with more oxygen ends in -ate; the form with one oxygen fewer ends in -ite.","When an element has four oxyanions (the halogens), per- … -ate marks one oxygen more than -ate, and hypo- … -ite one oxygen fewer than -ite.","The charge stays the same across a series; only the number of oxygens changes. -ate does not mean a fixed number of oxygens: nitrate has 3, sulfate has 4."],"rows":[["ClO⁻","hypochlorite","hypo- … -ite: 1 O"],["ClO₂⁻","chlorite","-ite: 2 O"],["ClO₃⁻","chlorate","-ate: 3 O"],["ClO₄⁻","perchlorate","per- … -ate: 4 O"],["NO₂⁻","nitrite","-ite"],["NO₃⁻","nitrate","-ate"],["SO₃²⁻","sulfite","-ite"],["SO₄²⁻","sulfate","-ate"],["MnO₄⁻","permanganate","Mn +7, highest"]],"morphs":["ate","ite","per","hypo"],"terms":["oxyanion","polyatomic"]},{"key":"hydrogen","title":"Hydrogen-, di-, thio-, peroxo-","body":["An oxyanion that still carries a removable hydrogen adds hydrogen- (or dihydrogen-): HCO₃⁻ hydrogencarbonate, H₂PO₄⁻ dihydrogenphosphate. IUPAC writes it as one word; ‘hydrogen carbonate’ with a space is also common.","The old prefix bi- means the same: bicarbonate = hydrogencarbonate, bisulfate = hydrogensulfate.","thio- means sulfur has replaced an oxygen: sulfate SO₄²⁻ → thiosulfate S₂O₃²⁻; cyanate OCN⁻ → thiocyanate SCN⁻.","di- in an ion name means two of the central atom: dichromate Cr₂O₇²⁻, diphosphate P₂O₇⁴⁻. peroxo- marks an O–O link."],"rows":[["HCO₃⁻","hydrogencarbonate · bicarbonate",""],["HSO₄⁻","hydrogensulfate · bisulfate",""],["H₂PO₄⁻","dihydrogenphosphate","2 H left"],["S₂O₃²⁻","thiosulfate","S replaces one O"],["SCN⁻","thiocyanate",""],["Cr₂O₇²⁻","dichromate","2 Cr"],["S₂O₈²⁻","peroxodisulfate","O–O bridge"]],"morphs":["hydrogen","bi","thio","di","peroxo"],"terms":["conjugate base"]},{"key":"ionic","title":"Naming ionic compounds","body":["Name the cation first, then the anion. Never use number prefixes for ionic compounds: CaCl₂ is calcium chloride, not calcium dichloride.","To write the formula, balance the charges. Find the lowest numbers of each ion that make the total charge zero (the ‘swap and drop’ shortcut: Al³⁺ and O²⁻ → Al₂O₃).","Put brackets round a polyatomic ion when you need more than one of it: Ca(OH)₂, Al₂(SO₄)₃, (NH₄)₂SO₄.","To name a compound of a variable metal, work back from the anion: in Fe₂(SO₄)₃ three sulfates give −6, so each of the two iron ions is +3 → iron(III) sulfate."],"rows":[["NaCl","sodium chloride","1+ and 1−"],["MgO","magnesium oxide","2+ and 2−"],["CaCl₂","calcium chloride","one Ca²⁺, two Cl⁻"],["Al₂O₃","aluminium oxide","2 × (+3) = 3 × (−2)"],["Ca(OH)₂","calcium hydroxide","brackets for 2 × OH⁻"],["Fe₂(SO₄)₃","iron(III) sulfate","−6 ÷ 2 Fe = +3"],["(NH₄)₂SO₄","ammonium sulfate","polyatomic cation"]],"morphs":[],"terms":["stoichiometry","empirical formula","lattice"]},{"key":"covalent","title":"Covalent (molecular) compounds: number prefixes","body":["Compounds of two non-metals use Greek number prefixes to say how many of each atom: mono-, di-, tri-, tetra-, penta-, hexa-, hepta-, octa-, nona-, deca-.","The less electronegative element comes first, and it never takes mono-: CO is carbon monoxide, not monocarbon monoxide.","The final a or o of the prefix is dropped before ‘oxide’: monoxide, pentoxide, heptoxide (but dioxide and trioxide keep theirs).","Some compounds keep traditional names: water, ammonia, hydrazine, phosphine, silane, nitric oxide."],"rows":[["CO","carbon monoxide","mono- only on the second element"],["CO₂","carbon dioxide","di = 2"],["SO₃","sulfur trioxide","tri = 3"],["N₂O₄","dinitrogen tetroxide","tetra → tetr before oxide"],["N₂O₅","dinitrogen pentoxide","penta → pent"],["PCl₅","phosphorus pentachloride",""],["SF₆","sulfur hexafluoride","hexa = 6"],["Cl₂O₇","dichlorine heptoxide","hepta = 7"],["P₄O₁₀","tetraphosphorus decoxide","deca = 10"]],"morphs":["mono","di","tri","tetra","penta","hexa","hepta","octa","deca"],"terms":["covalent","molecule"]},{"key":"acids","title":"Acids and their salts","body":["Binary acids (hydrogen + one non-metal, dissolved in water) are hydro- … -ic acid: HCl(aq) hydrochloric acid. Their salts are -ides.","Oxoacids follow the anion: an -ate ion comes from an -ic acid, and an -ite ion from an -ous acid. Memory aid: ‘If you ATE it, it was ICky; if you bITE it, it’s deliciOUS.’","per- and hypo- carry straight across: perchloric acid → perchlorates; hypochlorous acid → hypochlorites.","An acid that can give one H⁺ is monoprotic (HCl), two diprotic (H₂SO₄), three triprotic (H₃PO₄).","acid + base → salt + water. The salt’s name is the metal from the base plus the anion from the acid."],"rows":[["HCl","hydrochloric acid → chlorides","hydro- … -ic → -ide"],["H₂SO₄","sulfuric acid → sulfates","-ic → -ate"],["H₂SO₃","sulfurous acid → sulfites","-ous → -ite"],["HNO₃","nitric acid → nitrates",""],["HNO₂","nitrous acid → nitrites",""],["HClO₄","perchloric acid → perchlorates",""],["HClO","hypochlorous acid → hypochlorites",""],["H₃PO₄","phosphoric acid → phosphates","triprotic"],["CH₃COOH","ethanoic acid → ethanoates","-oic → -oate"]],"morphs":["hydro","ic","ous"],"terms":["acid","alkali","neutralisation","monoprotic","diprotic","triprotic","amphoteric"]},{"key":"hydrates","title":"Hydrates","body":["Many crystals hold water molecules in a fixed ratio, shown after a raised dot: CuSO₄·5H₂O. Name the salt, then add a number prefix + hydrate: copper(II) sulfate pentahydrate.","Without its water the salt is anhydrous (‘without water’). Heating blue copper(II) sulfate pentahydrate drives off the water and leaves white anhydrous copper(II) sulfate."],"rows":[["CuSO₄·5H₂O","copper(II) sulfate pentahydrate","penta = 5"],["MgSO₄·7H₂O","magnesium sulfate heptahydrate","Epsom salt"],["Na₂CO₃·10H₂O","sodium carbonate decahydrate","washing soda"],["CaSO₄·2H₂O","calcium sulfate dihydrate","gypsum"]],"morphs":["hydrate"],"terms":["hydrate","anhydrous","water of crystallisation","hygroscopic","deliquescent"]},{"key":"complex","title":"Complex ions (coordination compounds)","body":["A complex ion has a central metal ion with molecules or ions (ligands) bonded around it, written in square brackets: [Cu(NH₃)₄]²⁺.","Name the ligands first, in alphabetical order, with number prefixes, then the metal, then its oxidation state in Roman numerals.","Ligand names: H₂O aqua, NH₃ ammine (double m), Cl⁻ chlorido, CN⁻ cyanido, OH⁻ hydroxido, O²⁻ oxido, CO carbonyl, F⁻ fluorido. Older books use chloro, cyano, hydroxo.","If the whole complex is negative, the metal ends in -ate, often with its Latin stem: ferrate, cuprate, argentate, aurate, plumbate, stannate (but cobaltate, zincate, aluminate)."],"rows":[["[Cu(NH₃)₄]²⁺","tetraamminecopper(II)","positive: plain metal name"],["[Cu(H₂O)₆]²⁺","hexaaquacopper(II)","aqua = water"],["[Fe(CN)₆]⁴⁻","hexacyanidoferrate(II)","negative: iron → ferrate"],["[CuCl₄]²⁻","tetrachloridocuprate(II)","copper → cuprate"],["[Ag(CN)₂]⁻","dicyanidoargentate(I)","silver → argentate"],["[Al(OH)₄]⁻","tetrahydroxidoaluminate",""]],"morphs":["aqua","ammine","ido","ate"],"terms":["ligand","coordination number","complex ion","chelate"]}],"terms":[{"word":"cation","ipa":"/ˈkætaɪən/","say":"KAT-eye-un","parts":[{"text":"cat","type":"prefix","meaning":"down","origin":"Greek kata"},{"text":"ion","type":"root","meaning":"going","origin":"Greek ion, ‘going’"}],"def_":"A positively charged ion. It moves down towards the cathode (negative electrode) in electrolysis."},{"word":"anion","ipa":"/ˈænaɪən/","say":"AN-eye-un","parts":[{"text":"an","type":"prefix","meaning":"up","origin":"Greek ana"},{"text":"ion","type":"root","meaning":"going","origin":"Greek ion"}],"def_":"A negatively charged ion. It moves up towards the anode (positive electrode)."},{"word":"oxidation state","ipa":"/ˌɒksɪˈdeɪʃn steɪt/","say":"ok-sih-DAY-shun STATE","parts":[{"text":"oxid","type":"root","meaning":"oxygen, oxide","origin":"French oxide"},{"text":"ation","type":"suffix","meaning":"process","origin":"Latin -atio"}],"def_":"The charge an atom would have if all its bonds were ionic. Shown by Roman numerals in names: iron(III)."},{"word":"valency","ipa":"/ˈveɪlənsi/","say":"VAY-lun-see","parts":[{"text":"val","type":"root","meaning":"be strong, be worth","origin":"Latin valere"},{"text":"ency","type":"suffix","meaning":"quality","origin":"Latin -entia"}],"def_":"The number of bonds an atom usually forms, or the size of its     else if (nq.length >= 3 && normName(i.name).startsWith(nq)) { score = 58; why = "name"; }

    else if (qq === null && fq === base && c.hyd) { score = 66; why = "formula (hydrate)"; }
    else if (nq && nq === normName(c.name)) { score = 99; why = "name"; }
    else if (nq && c.alt.some((a) => normName(a) === nq)) { score = 94; why = "also called " + c.alt.find((a) => normName(a) === nq); }
    else if (nq.length >= 3 && normName(c.name).startsWith(nq)) { score = 56; why = "name"; }
    else if (nq.length >= 4 && c.alt.some((a) => normName(a).startsWith(nq))) { score = 50; why = "also called " + c.alt.find((a) => normName(a).startsWith(nq)); }
    else if (nq.length >= 4 && (normName(c.name).includes(nq) || c.alt.some((a) => normName(a).includes(nq)))) { score = 32; why = "name"; }
    else if (looksFormula && fq.length >= 2 && qq === null && c.f.includes(fq)) { score = 28; why = "contains " + fq; }
    if (score) res.push({ score, order: 400, tile: ftile(fmtF(c.f), "neu", "wide"), title: c.name, sub: [ipaSpan(c.ipa), "  ·  ", h("b", null, why)], saved: savedCpd(c), open: () => openCpd(c.id) });
  }
  for (const t of D.terms) {
    const tn = normName(t.word);
    let score = nq === tn ? 90 : nq.length >= 4 && tn.startsWith(nq) ? 48 : 0;
    if (score) res.push({ score, order: 500, tile: ftile("Aa", "neu"), title: t.word, sub: [ipaSpan(t.ipa), "  ·  key word"], saved: isSaved(t.word), open: () => go("inorg", { sub: "rules" }) });
  }
  return res;
});

/* ---------- element card: ions and compounds ---------- */
EXTRAS.push((e) => {
  const ions = D.ions.filter((i) => i.els.includes(e.s));
  const cps = D.cpds.filter((c) => c.els.includes(e.s) && !c.hyd);
  if (!ions.length && !cps.length) return null;
  const MAXC = 16;
  return h("section", { class: "sec" }, h("h3", { class: "eyebrow" }, `Ions and compounds with ${e.n.toLowerCase()}`),
    ions.length ? h("div", { class: "chips" }, h("span", { class: "pg" }, "Ions"), ions.map(ionChip)) : null,
    cps.length ? h("div", { class: "chips" }, h("span", { class: "pg" }, "Compounds"), cps.slice(0, MAXC).map(cpdChip),
      cps.length > MAXC ? h("button", { class: "btn ghost", type: "button", onclick: () => { $("cq").value = e.s; show("search"); } }, `All ${cps.length} →`) : null) : null);
});

Object.assign(VIEWS, { inorg: renderInorg, ion: renderIon, cpd: renderCpd });
window.__inorg = { fmtF, ionF, parseF, balance, salt, normName, cleanFormula, D };
K.start();
})();
</script>
